{% extends 'base.html' %}{% block content %}<h1>Демонстрационное письмо</h1><p class="lead">Это имитация подтверждения email. Токен действует 30 минут и доступен только браузеру, создавшему регистрацию.</p>{% if error %}<div class="notice">{{ error }}</div>{% endif %}<form class="card" method="post">{% csrf_token %}<input type="hidden" name="token" value="{{ pending.token }}"><p>Подтвердите регистрацию, чтобы продолжить.</p><button class="primary">Подтвердить demo email</button></form>{% endblock %}
