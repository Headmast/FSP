[project]
name = "fsp-client"
version = "0.1.0"
description = "FSP candidate and employer CLI and local MCP bridge"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx==0.28.1", "keyring==25.7.0", "mcp==2.3.0"]

[project.scripts]
fsp = "fsp_client.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsp_client"]
